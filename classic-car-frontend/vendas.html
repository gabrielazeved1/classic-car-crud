<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Histórico de Vendas - Classic Car</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/vendas.css">
</head>
<body>
    <header id="header-placeholder"></header>

    <header class="page-header">
        <h1>Histórico de Vendas</h1>
        <p>Acompanhe todas as negociações concluídas.</p>
    </header>

    <main>
        <div class="venda-container">
            <!-- Mensagem de instrução (começa visível) -->
            <section id="instruction-message" class="instruction-card">
                <p>Para registar uma nova venda, por favor, escolha um carro primeiro na página <a href="index.html">principal</a> ou na <a href="loja.html">loja</a>.</p>
            </section>

            <!-- Detalhes do carro selecionado (começa escondido) -->
            <section id="carro-selecionado-detalhes" class="carro-details-card" style="display: none;"></section>

            <!-- Formulário de Venda (começa escondido) -->
            <section class="form-section" style="display: none;">
                <h2>Registar Nova Venda</h2>
                <form id="vendaForm" class="form-grid">
                    <label for="carroId">Carro:</label>
                    <select id="carroId" required disabled></select> <!-- Desativado para não ser alterado -->

                    <label for="clienteId">Cliente:</label>
                    <select id="clienteId" required></select>

                    <label for="vendedorId">Vendedor:</label>
                    <select id="vendedorId" required></select>

                    <label for="data">Data da Venda:</label>
                    <input type="text" id="data" required placeholder="dd/mm/aaaa">

                    <label for="valor">Valor (R$):</label>
                    <input type="text" id="valor" required>

                    <button type="submit" class="submit-btn">Confirmar Venda</button>
                </form>
            </section>

             <!-- Histórico de Vendas -->
             <section class="historico-vendas">
                <h2>Vendas Recentes</h2>
                <div id="vendas-container" class="vendas-grid">
                    <!-- Cards de vendas inseridos via JS -->
                </div>
            </section>
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/header.js"></script>
    <script src="https://unpkg.com/imask"></script>
    <script src="js/vendas.js"></script>
</body>
</html>
