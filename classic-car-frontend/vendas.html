<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Registrar Vendas - Classic Car</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="carros.html">Carros</a>
        <a href="clientes.html">Clientes</a>
        <a href="vendas.html">Vendas</a>
        <a href="vendedores.html">Vendedores</a>
        <a href="loja.html">Loja</a>
    </nav>

    <h1>Registrar Venda</h1>

    <form id="vendaForm">
        <label for="carroId">Carro:</label>
        <select id="carroId" required></select><br>

        <label for="clienteId">Cliente:</label>
        <select id="clienteId" required></select><br>

        <label for="vendedorId">Vendedor:</label>
        <select id="vendedorId" required></select><br>

        <label for="data">Data da Venda:</label>
        <input type="date" id="data" required><br>

        <label for="valor">Valor:</label>
        <input type="number" id="valor" step="0.01" required><br><br>

        <button type="submit">Registrar Venda</button>
    </form>

    <h2>Vendas Registradas</h2>
    <ul id="vendasList"></ul>

    <script src="js/vendas.js"></script>
</body>
</html>
