<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Registar Venda - Classic Car</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/vendas.css">
</head>
<body>
    <header id="header-placeholder"></header>

    <header class="page-header">
        <h1>Registar Venda</h1>
        <p>Preencha os dados abaixo para concluir a negociação.</p>
    </header>

    <main>
        <div class="venda-container">
            <!-- Detalhes do carro selecionado -->
            <section id="carro-selecionado-detalhes" class="carro-details-card" style="display: none;">
                <!-- Conteúdo preenchido por JS -->
            </section>

            <!-- Formulário de Venda -->
            <section class="form-section">
                <h2>Dados da Venda</h2>
                <form id="vendaForm" class="form-grid">
                    <label for="carroId">Carro:</label>
                    <select id="carroId" required></select>

                    <label for="clienteId">Cliente:</label>
                    <select id="clienteId" required></select>

                    <label for="vendedorId">Vendedor:</label>
                    <select id="vendedorId" required></select>

                    <label for="data">Data da Venda:</label>
                    <input type="text" id="data" required placeholder="dd/mm/aaaa">

                    <label for="valor">Valor (R$):</label>
                    <input type="text" id="valor" required> <!-- Mudado para 'text' -->

                    <button type="submit" class="submit-btn">Registar Venda</button>
                </form>
            </section>

             <!-- Histórico de Vendas -->
             <section class="historico-vendas">
                <h2>Histórico de Vendas Recentes</h2>
                <div id="vendas-container" class="vendas-grid">
                    <!-- Cards de vendas inseridos via JS -->
                </div>
            </section>
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/header.js"></script>
    <script src="https://unpkg.com/imask"></script> <!-- Adicionar a biblioteca IMask -->
    <script src="js/vendas.js"></script>
</body>
</html>
