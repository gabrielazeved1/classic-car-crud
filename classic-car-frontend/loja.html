<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Loja - Classic Car</title>
    <link rel="stylesheet" href="css/style.css"> <!-- Estilo geral -->
    <link rel="stylesheet" href="css/loja.css">  <!-- Estilo específico da loja -->
</head>
<body>
    <!-- O cabeçalho será inserido aqui pelo header.js -->
    <header id="header-placeholder"></header>

    <header class="banner" style="background-image: url('https://images.unsplash.com/photo-1552519507-da3b142c6e3d?q=80&w=2070&auto=format&fit=crop');">
        <h1>Carros à Venda</h1>
        <p>Confira o nosso selecionado e variado showroom virtual.</p>
    </header>

    <main>
        <!-- O container onde os carros serão exibidos -->
        <div id="carros-vitrine" class="vitrine-grid">
            <!-- Os cards dos carros serão inseridos aqui pelo JavaScript -->
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/header.js"></script>
    <script src="js/loja.js"></script>
</body>
</html>
