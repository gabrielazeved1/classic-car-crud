<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Classic Car - Concessionária de Carros Antigos</title>
    <link rel="stylesheet" href="css/style.css"> <!-- Estilo geral -->
    <link rel="stylesheet" href="css/loja.css">  <!-- Reutilizando o estilo da loja -->
</head>
<body>
    <!-- O cabeçalho será inserido aqui pelo header.js -->
    <header id="header-placeholder"></header>

    <header class="banner" style="background-image: url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?q=80&w=2070&auto=format&fit=crop');">
        <h1>Bem-vindo à Classic Car</h1>
        <p>O seu destino para encontrar relíquias automotivas.</p>
    </header>

    <main>
        <h2 style="text-align: center; font-size: 2em; margin: 40px 0;">Destaques à Venda</h2>
        <!-- O container onde os carros serão exibidos -->
        <div id="home-vitrine" class="vitrine-grid">
            <!-- Os cards dos carros serão inseridos aqui pelo JavaScript -->
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/header.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
