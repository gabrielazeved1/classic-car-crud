<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerir Carros - Classic Car</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Adicionei a ligação para o CSS de admin para consistência -->
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <!-- 1. O cabeçalho estático foi removido e este placeholder foi adicionado. -->
    <header id="header-placeholder"></header>

    <header class="banner">
        <h1>Gerenciamento de Carros</h1>
        <p>Adicione, edite e remova os carros do seu inventário.</p>
    </header>

    <main class="admin-main">
        <div class="form-container">
            <h2 id="form-title">Adicionar Novo Carro</h2>
            <!-- O atributo 'enctype' é ESSENCIAL para upload de arquivos -->
            <form id="carroForm" enctype="multipart/form-data">
                <input type="hidden" id="carroId">

                <label for="marca">Marca:</label>
                <input type="text" id="marca" required>

                <label for="modelo">Modelo:</label>
                <input type="text" id="modelo" required>

                <label for="ano">Ano:</label>
                <input type="number" id="ano" required>

                <label for="preco">Preço:</label>
                <input type="number" step="0.01" id="preco" required>

                <label for="descricao">Descrição:</label>
                <textarea id="descricao" rows="3"></textarea>

                <!-- Campo de upload de imagem -->
                <label for="imagemFile">Imagem do Carro:</label>
                <input type="file" id="imagemFile" accept="image/*">

                <div class="form-buttons">
                    <button type="submit">Guardar Carro</button>
                    <button type="button" id="cancelButton" style="display: none;">Cancelar Edição</button>
                </div>
            </form>
        </div>

        <div class="table-container">
            <h2>Carros Registados</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Imagem</th>
                        <th>Marca</th>
                        <th>Modelo</th>
                        <th>Ano</th>
                        <th>Preço</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="carrosTable">
                    <!-- Linhas da tabela serão inseridas aqui pelo JavaScript -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- 2. Adicionei o script do cabeçalho ANTES do script da página -->
    <script src="js/header.js"></script>
    <script src="js/carros.js"></script>
</body>
</html>
