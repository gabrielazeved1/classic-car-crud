<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerir Carros - Classic Car</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/modal.css">
</head>
<body>
    <header id="header-placeholder"></header>

    <main class="admin-page">
        <h1>Gestão de Carros</h1>
        <div class="admin-container">
            <!-- Formulário -->
            <div class="form-container">
                <h2 id="form-title">Adicionar Novo Carro</h2>
                <form id="carroForm">
                    <input type="hidden" id="carroId">
                    <label for="marca">Marca:</label>
                    <input type="text" id="marca" required>
                    <label for="modelo">Modelo:</label>
                    <input type="text" id="modelo" required>
                    <label for="ano">Ano:</label>
                    <input type="number" id="ano" required>
                    <label for="preco">Preço:</label>
                    <input type="text" id="preco" required> <!-- Mudado para 'text' para a máscara funcionar melhor -->
                    <label for="descricao">Descrição:</label>
                    <textarea id="descricao" rows="3"></textarea>
                    <label for="imagemFile">Imagem do Carro:</label>
                    <input type="file" id="imagemFile" accept="image/*">
                    <button type="submit">Guardar</button>
                    <button type="button" id="cancel-edit-btn" style="display: none;">Cancelar Edição</button>
                </form>
            </div>
            <!-- Tabela -->
            <div class="table-container">
                <h2>Carros Registados</h2>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Imagem</th>
                            <th>Marca</th>
                            <th>Modelo</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="carros-table-body"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Estrutura do Modal -->
    <div id="confirm-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Confirmar Exclusão</h2>
            <p>Tem a certeza de que deseja excluir este carro? Esta ação não pode ser desfeita.</p>
            <div class="modal-buttons">
                <button id="modal-cancel-btn" class="modal-btn cancel">Cancelar</button>
                <button id="modal-confirm-btn" class="modal-btn confirm">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/header.js"></script>
    <script src="https://unpkg.com/imask"></script> <!-- Adicionar a biblioteca IMask -->
    <script src="js/carros.js"></script>
</body>
</html>
