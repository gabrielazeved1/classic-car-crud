<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>CRUD Clientes</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="carros.html">Carros</a>
    <a href="clientes.html">Clientes</a>
    <a href="vendas.html">Vendas</a>
    <a href="vendedores.html">Vendedores</a>
    <a href="loja.html">Loja</a>
  </nav>

  <h1>CRUD Clientes</h1>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>CPF</th>
        <th>Contato</th>
        <th>Endereço</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="clientes-table-body"></tbody>
  </table>

  <h2>Adicionar Novo Cliente</h2>
  <form id="cliente-form">
    <input type="text" id="nome" placeholder="Nome" required>
    <input type="text" id="cpf" placeholder="CPF" required>
    <input type="text" id="contato" placeholder="Contato" required>
    <input type="text" id="endereco" placeholder="Endereço" required>
    <button type="submit">Adicionar Cliente</button>
  </form>

  <h2>Editar Cliente</h2>
  <form id="editar-form" style="display:none;">
    <input type="hidden" id="edit-id">
    <input type="text" id="edit-nome" placeholder="Nome" required>
    <input type="text" id="edit-cpf" placeholder="CPF" required>
    <input type="text" id="edit-contato" placeholder="Contato" required>
    <input type="text" id="edit-endereco" placeholder="Endereço" required>
    <button type="submit">Salvar Alterações</button>
    <button type="button" onclick="cancelarEdicao()">Cancelar</button>
  </form>

  <script src="js/clientes.js"></script>
</body>
</html>
