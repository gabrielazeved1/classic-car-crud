<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerir Clientes - Classic Car</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/modal.css">
</head>
<body>
    <header id="header-placeholder"></header>

    <main class="admin-page">
        <h1>Gestão de Clientes</h1>
        <div class="admin-container">
            <!-- Formulário -->
            <div class="form-container">
                <h2 id="form-title">Adicionar Novo Cliente</h2>
                <form id="cliente-form">
                    <input type="hidden" id="clienteId">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" required>
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" required>
                    <label for="contato">Contacto (Telefone):</label>
                    <input type="text" id="contato">
                    <label for="endereco">Endereço:</label>
                    <input type="text" id="endereco">
                    <button type="submit">Guardar</button>
                    <button type="button" id="cancel-edit-btn" style="display: none;">Cancelar Edição</button>
                </form>
            </div>
            <!-- Tabela -->
            <div class="table-container">
                <h2>Clientes Registados</h2>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>CPF</th>
                            <th>Contacto</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="clientes-table-body"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Estrutura do Modal -->
    <div id="confirm-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Confirmar Exclusão</h2>
            <p>Tem a certeza de que deseja excluir este registo? Esta ação não pode ser desfeita.</p>
            <div class="modal-buttons">
                <button id="modal-cancel-btn" class="modal-btn cancel">Cancelar</button>
                <button id="modal-confirm-btn" class="modal-btn confirm">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/header.js"></script>
    <script src="https://unpkg.com/imask"></script> <!-- Adicionar a biblioteca IMask -->
    <script src="js/clientes.js"></script>
</body>
</html>
